name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 repository secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing STORE_PASSWORD repository secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD repository secret'; exit 1; }
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          encoded="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          case "$encoded" in
            KEYSTORE_BASE64=*) encoded="${encoded#KEYSTORE_BASE64=}" ;;
          esac
          printf '%s' "$encoded" | base64 --decode > my-upload-key.jks
          chmod 600 my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias upload >/dev/null
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build signed release APK only
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          ${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remoffice-apk-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk
      - name: Remove signing material
        if: always()
        run: rm -f my-upload-key.jks
