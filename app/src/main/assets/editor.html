<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>REMOOFFICE محرر</title>
<style>

  /* Bundled fonts: no dependency on device-installed fonts. */
  @font-face {
    font-family: 'REMOO Noto Sans Arabic';
    src: url('fonts/NotoSansArabic-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'REMOO Noto Sans';
    src: url('fonts/NotoSans-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'REMOO Noto Serif';
    src: url('fonts/NotoSerif-VF.ttf') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
  }
  @font-face { font-family: 'Amiri'; src: url('fonts/Amiri-Regular.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Amiri'; src: url('fonts/Amiri-Bold.ttf') format('truetype'); font-style: normal; font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Variable.ttf') format('truetype'); font-style: normal; font-weight: 200 1000; font-display: swap; }
  @font-face { font-family: 'Tajawal'; src: url('fonts/Tajawal-Regular.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Tajawal'; src: url('fonts/Tajawal-Bold.ttf') format('truetype'); font-style: normal; font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Noto Naskh Arabic'; src: url('fonts/NotoNaskhArabic-Variable.ttf') format('truetype'); font-style: normal; font-weight: 400 700; font-display: swap; }
  @font-face { font-family: 'Noto Kufi Arabic'; src: url('fonts/NotoKufiArabic-Variable.ttf') format('truetype'); font-style: normal; font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Roboto'; src: url('fonts/Roboto-Variable.ttf') format('truetype'); font-style: normal; font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Open Sans'; src: url('fonts/OpenSans-Variable.ttf') format('truetype'); font-style: normal; font-weight: 300 800; font-display: swap; }
  @font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Variable.ttf') format('truetype'); font-style: normal; font-weight: 100 900; font-display: swap; }

  :root {
    --page-width: 210mm;
    --page-min-height: 297mm;
    --page-margin-top: 25.4mm;
    --page-margin-right: 25.4mm;
    --page-margin-bottom: 25.4mm;
    --page-margin-left: 25.4mm;
    --page-columns: 1;
    --page-bg: #FFFFFF;
    --page-text: #1E293B;
    --zoom-scale: 1;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: #E8ECF2;
    font-family: 'REMOO Noto Sans Arabic', 'REMOO Noto Sans', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .workspace {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 64px 12px;
    min-height: 100vh;
    transform: scale(var(--zoom-scale));
    transform-origin: top center;
  }

  .page-container {
    width: 100%;
    max-width: var(--page-width);
    min-height: var(--page-min-height);
    background-color: var(--page-bg);
    color: var(--page-text);
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12), 0 1px 4px rgba(15, 23, 42, 0.08);
    border-radius: 3px;
    padding: var(--page-margin-top) var(--page-margin-right) var(--page-margin-bottom) var(--page-margin-left);
    display: flex;
    flex-direction: column;
    transition: padding 0.2s ease, max-width 0.2s ease, background-color 0.2s ease;
  }

  .page-header, .page-footer {
    font-size: 10pt;
    color: #64748B;
    border-bottom: 1px dashed #CBD5E1;
    padding-bottom: 6px;
    margin-bottom: 12px;
    outline: none;
    min-height: 20px;
  }

  .page-footer {
    border-bottom: none;
    border-top: 1px dashed #CBD5E1;
    padding-bottom: 0;
    padding-top: 6px;
    margin-top: auto;
    margin-bottom: 0;
  }

  .page-header:empty::before {
    content: "انقر لإضافة رأس الصفحة (Header)...";
    color: #94A3B8;
  }

  .page-footer:empty::before {
    content: "انقر لإضافة تذييل الصفحة (Footer)...";
    color: #94A3B8;
  }

  .page {
    flex: 1;
    outline: none;
    font-size: 14pt;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    column-count: var(--page-columns);
    column-gap: 24px;
  }

  .page-container.read-mode {
    box-shadow: none;
  }

  .page-container.read-mode .page-header:empty,
  .page-container.read-mode .page-footer:empty {
    display: none;
  }

  .page p {
    margin: 0 0 8pt 0;
  }

  .page h1 { font-size: 22pt; margin: 12pt 0 6pt 0; color: #0F172A; }
  .page h2 { font-size: 18pt; margin: 10pt 0 5pt 0; color: #1E293B; }
  .page h3 { font-size: 15pt; margin: 8pt 0 4pt 0; color: #334155; }
  .page blockquote {
    border-inline-start: 4px solid #1A56DB;
    margin: 8pt 0;
    padding: 6pt 12pt;
    background: rgba(26, 86, 219, 0.05);
    color: #475569;
  }

  .page hr {
    border: none;
    border-top: 1.5px solid #CBD5E1;
    margin: 12pt 0;
  }

  .page table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    table-layout: fixed;
  }

  .page td, .page th {
    border: 1px solid #94A3B8;
    padding: 6px 8px;
    min-width: 24px;
    vertical-align: top;
    word-break: break-word;
  }

  .page td.selected-cell {
    outline: 2px solid #1A56DB;
  }

  #editor { position: relative; }
  #editor.cell-selecting td, #editor.cell-selecting th { user-select: none; -webkit-user-select: none; }
  #editor .draw-layer { position: absolute; left: 0; top: 0; z-index: 25; overflow: visible; pointer-events: none; }
  #editor.drawing-mode .draw-layer { pointer-events: auto; touch-action: none; }

  .page img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 6px 0;
    display: inline-block;
    cursor: pointer;
  }

  .page img.selected-img {
    outline: 2.5px solid #1A56DB;
    outline-offset: 2px;
  }

  .page a {
    color: #1A56DB;
    text-decoration: underline;
  }

  .page-break {
    border-top: 2px dashed #94A3B8;
    margin: 18px 0;
    padding-top: 4px;
    text-align: center;
    font-size: 10pt;
    color: #64748B;
    user-select: none;
    page-break-after: always;
    break-after: page;
  }

  .page-break::after {
    content: "— فاصل صفحة / Page Break —";
  }

  .page-break.auto-page-break {
    height: 20px;
    min-height: 20px;
    margin: 12px calc(-1 * var(--page-margin-right)) 12px calc(-1 * var(--page-margin-left));
    padding: 0;
    border: 0;
    border-block: 1px solid #CBD5E1;
    background: #E8ECF2;
    break-after: page;
    page-break-after: always;
  }

  .page-break.auto-page-break::after { content: ""; }

  .page-number {
    display: inline-block;
    padding: 1px 6px;
    background: #F1F5F9;
    border-radius: 4px;
    font-size: 11pt;
    color: #475569;
  }

  .text-box {
    border: 1.5px solid #1A56DB;
    background-color: #F8FAFC;
    padding: 10px 14px;
    margin: 10px 0;
    border-radius: 6px;
    min-height: 44px;
  }

  .shape-block {
    margin: 10px 0;
    display: inline-block;
  }

  .selected-range-cell {
    background: rgba(26, 86, 219, 0.16) !important;
    outline: 2px solid #1A56DB;
    outline-offset: -2px;
  }

  .editor-floating-tools {
    position: fixed;
    z-index: 10000;
    display: none;
    direction: rtl;
    font: 14px 'REMOO Noto Sans Arabic', sans-serif;
    color: #1E293B;
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
    touch-action: manipulation;
  }

  .editor-floating-tools.visible { display: flex; }

  #miniFormatToolbar {
    align-items: center;
    gap: 4px;
    padding: 5px 7px;
    white-space: nowrap;
  }

  .editor-floating-tools button {
    min-width: 36px;
    min-height: 36px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    touch-action: manipulation;
  }

  .editor-floating-tools button:active,
  .editor-floating-tools button.active { background: #DBEAFE; color: #1A56DB; }

  .mini-color-palette {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px;
  }

  .mini-color-palette.visible { display: flex; }

  .mini-color-swatch {
    width: 25px;
    height: 25px;
    min-width: 25px !important;
    min-height: 25px !important;
    border-radius: 50% !important;
    border: 1px solid #94A3B8 !important;
  }

  /* Touch table controls: positioned around the table, never over its cells. */
  .table-selection-chrome {
    position: absolute;
    display: none;
    z-index: 40;
    pointer-events: none;
    direction: ltr;
  }
  .table-selection-chrome.visible { display: block; }
  .table-selection-chrome button {
    pointer-events: auto;
    min-width: 34px;
    min-height: 30px;
    border: 1px solid #94A3B8;
    background: #FFFFFF;
    color: #334155;
    border-radius: 3px;
    font: 15px 'REMOO Noto Sans', 'REMOO Noto Sans Arabic', sans-serif;
    padding: 2px 8px;
    touch-action: manipulation;
  }
  .table-selection-chrome button:active,
  .table-selection-chrome button.active { background: #90CAF9; color: #0F172A; }
  .table-col-handles {
    position: absolute;
    left: 0;
    top: -34px;
    width: 100%;
    height: 30px;
    display: grid;
    gap: 0;
  }
  .table-row-handles {
    position: absolute;
    right: -40px;
    top: 0;
    width: 36px;
    display: grid;
    gap: 0;
  }
  .table-add-col { position: absolute; left: -42px; top: -34px; border-radius: 50% !important; font-size: 25px !important; line-height: 24px; padding: 0 !important; }
  .table-move { position: absolute; right: -42px; top: -34px; border-radius: 50% !important; font-size: 19px !important; line-height: 24px; padding: 0 !important; }
  .table-add-row { position: absolute; right: -42px; top: 50%; transform: translateY(-50%); border-radius: 50% !important; font-size: 25px !important; line-height: 24px; padding: 0 !important; }
  .table-selection-chrome .selected { background: #90CAF9; }


  #objectQuickToolbar {
    display: none;
    flex-direction: column;
    gap: 8px;
    width: min(94vw, 440px);
    max-height: 42vh;
    overflow-y: auto;
    padding: 12px;
  }

  #objectQuickToolbar.visible { display: flex; }

  .object-tools-heading, .object-tools-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .object-tools-row button { flex: 1; border: 1px solid #E2E8F0; }
  .object-tools-row button.active { border-color: #1A56DB; }
  .object-color { min-width: 28px !important; min-height: 28px !important; border-radius: 50% !important; border: 3px solid currentColor !important; }
  .object-border-sample { border-radius: 5px !important; }

  #objectSelectionOutline {
    position: fixed;
    z-index: 9998;
    display: none;
    border: 1.5px solid #475569;
    pointer-events: none;
    touch-action: none;
  }

  #objectSelectionOutline.visible { display: block; }

  .object-handle {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px solid #FFFFFF;
    border-radius: 50%;
    background: #60646B;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    touch-action: none;
  }

  .object-handle[data-handle="nw"] { left: 0; top: 0; }
  .object-handle[data-handle="n"] { left: 50%; top: 0; }
  .object-handle[data-handle="ne"] { left: 100%; top: 0; }
  .object-handle[data-handle="e"] { left: 100%; top: 50%; }
  .object-handle[data-handle="se"] { left: 100%; top: 100%; }
  .object-handle[data-handle="s"] { left: 50%; top: 100%; }
  .object-handle[data-handle="sw"] { left: 0; top: 100%; }
  .object-handle[data-handle="w"] { left: 0; top: 50%; }

  .object-rotate-handle {
    position: absolute;
    left: 50%;
    top: -40px;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: #60646B;
    color: #FFFFFF;
    transform: translateX(-50%);
    pointer-events: auto;
    touch-action: none;
  }

  #drawingModeBadge {
    position: fixed;
    z-index: 10001;
    display: none;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 18px;
    color: #FFFFFF;
    background: #1A56DB;
    font: 13px 'REMOO Noto Sans Arabic', sans-serif;
  }

  #drawingModeBadge.visible { display: block; }

  @media print {
    .editor-floating-tools, #objectSelectionOutline, #drawingModeBadge { display: none !important; }
  }

  ins.remoffice-insert {
    background-color: #DCFCE7;
    color: #166534;
    text-decoration: underline;
    padding: 1px 3px;
    border-radius: 2px;
  }

  del.remoffice-delete {
    background-color: #FEE2E2;
    color: #991B1B;
    text-decoration: line-through;
    padding: 1px 3px;
    border-radius: 2px;
  }

  mark.remoffice-comment-anchor {
    background-color: #FEF08A;
    border-bottom: 2px solid #D97706;
    padding: 1px 3px;
    cursor: pointer;
    border-radius: 2px;
  }

  mark.remoffice-comment-anchor.resolved {
    background-color: #E2E8F0;
    border-bottom-color: #94A3B8;
  }

  sup.remoffice-note-reference {
    color: #1A56DB;
    font-weight: bold;
    cursor: pointer;
    padding: 0 2px;
  }

  span.remoffice-bookmark {
    border-inline-start: 3px solid #7C3AED;
    margin: 0 2px;
    display: inline-block;
    width: 0;
    height: 1em;
    vertical-align: middle;
  }

  .remoffice-footnotes, .remoffice-endnotes {
    margin-top: 24px;
    border-top: 1px dashed #CBD5E1;
    padding-top: 12px;
    font-size: 10pt;
    color: #475569;
  }

  .remoffice-note-item {
    margin: 4px 0;
  }

  .remoffice-toc-box {
    border: 1px solid #CBD5E1;
    background: #F8FAFC;
    padding: 12px 16px;
    border-radius: 8px;
    margin: 12px 0;
  }

  @media print {
    html, body { background: #FFFFFF; }
    .workspace { padding: 0; transform: none; }
    .page-container { box-shadow: none; max-width: 100%; border-radius: 0; }
    .page-header:empty, .page-footer:empty { display: none; }
    .page-break { border: none; margin: 0; padding: 0; }
    .page-break::after { content: ""; }
  }
</style>
</head>
<body>
<div class="workspace">
  <div id="pageContainer" class="page-container">
    <div id="pageHeader" class="page-header" contenteditable="true"></div>
    <div id="editor" class="page" contenteditable="true" spellcheck="true">
      <p>مرحباً بك في <b>REMOOFFICE محرر</b> — محرر المستندات الاحترافي المتكامل.</p>
      <p>ابدأ الكتابة هنا أو استخدم شريط الأدوات بالأسفل لتنسيق النصوص، إدراج الجداول، الصور، وتخطيط الصفحة.</p>
    </div>
    <section id="remofficeFootnotes" class="remoffice-footnotes" style="display:none;">
      <b>الحواشي السفلية / Footnotes:</b>
    </section>
    <section id="remofficeEndnotes" class="remoffice-endnotes" style="display:none;">
      <b>الحواشي الختامية / Endnotes:</b>
    </section>
    <div id="pageFooter" class="page-footer" contenteditable="true"></div>
  </div>
</div>

<div id="miniFormatToolbar" class="editor-floating-tools" role="toolbar" aria-label="تنسيق النص المحدد">
  <button type="button" data-format-action="bold" aria-label="عريض"><b>B</b></button>
  <button type="button" data-format-action="italic" aria-label="مائل"><i>I</i></button>
  <button type="button" data-format-action="underline" aria-label="تحته خط"><u>U</u></button>
  <button type="button" data-format-palette="foreColor" aria-label="لون النص">A</button>
  <button type="button" data-format-palette="backColor" aria-label="تظليل النص">▤</button>
  <div id="miniForePalette" class="mini-color-palette" data-palette="foreColor"></div>
  <div id="miniBackPalette" class="mini-color-palette" data-palette="backColor"></div>
</div>

<div id="tableSelectionChrome" class="table-selection-chrome" aria-label="أدوات تحديد الجدول">
  <button type="button" class="table-add-col" data-table-action="add-col" aria-label="إضافة عمود">＋</button>
  <div class="table-col-handles" aria-label="أعمدة الجدول"></div>
  <button type="button" class="table-move" data-table-action="move" aria-label="تحريك الجدول">↕</button>
  <div class="table-row-handles" aria-label="صفوف الجدول"></div>
  <button type="button" class="table-add-row" data-table-action="add-row" aria-label="إضافة صف">＋</button>
</div>

<div id="objectSelectionOutline" aria-hidden="true">
  <button type="button" class="object-rotate-handle" data-handle="rotate" aria-label="تدوير الشكل">↻</button>
  <span class="object-handle" data-handle="nw"></span><span class="object-handle" data-handle="n"></span>
  <span class="object-handle" data-handle="ne"></span><span class="object-handle" data-handle="e"></span>
  <span class="object-handle" data-handle="se"></span><span class="object-handle" data-handle="s"></span>
  <span class="object-handle" data-handle="sw"></span><span class="object-handle" data-handle="w"></span>
</div>

<div id="objectQuickToolbar" class="editor-floating-tools" role="toolbar" aria-label="أداة الرسم وتنسيق الكائن">
  <div class="object-tools-heading"><strong>أداة الرسم</strong><button type="button" id="objectDragButton" aria-label="تحريك الكائن">⠿ تحريك</button></div>
  <div class="object-tools-row" aria-label="التفاف النص">
    <button type="button" data-wrap="inline">في السطر مع النص</button>
    <button type="button" data-wrap="top-bottom">أعلى وأسفل</button>
    <button type="button" data-wrap="square">مربع</button>
    <button type="button" data-wrap="front">أمام النص</button>
    <button type="button" data-wrap="behind">خلف النص</button>
  </div>
  <div class="object-tools-row" aria-label="نمط الحد">
    <button type="button" class="object-border-sample" data-border="none">◯</button>
    <button type="button" class="object-border-sample" data-border="dashed">- - -</button>
    <button type="button" class="object-border-sample" data-border="solid">━━━━</button>
  </div>
  <div class="object-tools-row" aria-label="لون الحد">
    <button type="button" class="object-color" data-object-color="#00A6D6" style="color:#00A6D6"></button>
    <button type="button" class="object-color" data-object-color="#70BF44" style="color:#70BF44"></button>
    <button type="button" class="object-color" data-object-color="#D8E600" style="color:#D8E600"></button>
    <button type="button" class="object-color" data-object-color="#F2A900" style="color:#F2A900"></button>
    <button type="button" class="object-color" data-object-color="#E31B23" style="color:#E31B23"></button>
    <button type="button" class="object-color" data-object-color="#60646B" style="color:#60646B"></button>
  </div>
</div>

<div id="drawingModeBadge">وضع الرسم نشط — المس بإصبعك للرسم <button type="button" id="stopDrawingButton">إنهاء</button></div>

<script>
(function() {
  const editor = document.getElementById('editor');
  const pageContainer = document.getElementById('pageContainer');
  const supportedFontFamilies = new Set([
    'REMOO Noto Sans Arabic', 'REMOO Noto Sans', 'REMOO Noto Serif',
    'Amiri', 'Cairo', 'Tajawal', 'Noto Naskh Arabic', 'Noto Kufi Arabic',
    'Roboto', 'Open Sans', 'Montserrat'
  ]);
  let currentFontSizePt = 14;
  let currentLineHeight = '1.5';
  let lastSelectedCell = null;
  let lastSelectedImage = null;
  let lastSelectedObject = null;
  let lastSelectedTable = null;
  let savedEditorRange = null;
  let selectedCells = [];
  let drawingMode = false;
  let drawingLayer = null;
  let copiedFormat = null;

  let suppressTracking = false;
  let trackChangesEnabled = false;
  let trackedChangeIndex = -1;
  let tableChrome = null;
  let tableMoveState = null;

  function saveEditorSelection() {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return;
    const range = selection.getRangeAt(0);
    if (editor.contains(range.commonAncestorContainer)) {
      savedEditorRange = range.cloneRange();
    }
  }

  function restoreEditorSelection() {
    if (!savedEditorRange || !editor.contains(savedEditorRange.commonAncestorContainer)) return false;
    const selection = window.getSelection();
    if (!selection) return false;
    try {
      selection.removeAllRanges();
      selection.addRange(savedEditorRange.cloneRange());
      return true;
    } catch (_) {
      savedEditorRange = null;
      return false;
    }
  }

  function focusEditor() {
    if (editor.getAttribute('contenteditable') === 'true') {
      editor.focus({ preventScroll: true });
      restoreEditorSelection();
    }
  }

  function getClosestTag(node, tagName) {
    while (node && node !== editor) {
      if (node.nodeType === 1 && node.tagName.toLowerCase() === tagName.toLowerCase()) {
        return node;
      }
      node = node.parentNode;
    }
    return null;
  }

  function getSelectedFontName(selection) {
    let node = selection && selection.rangeCount > 0 ? selection.getRangeAt(0).startContainer : null;
    if (node && node.nodeType === 3) node = node.parentElement;
    while (node && node !== editor) {
      const declared = node.getAttribute && (node.getAttribute('face') || node.style.fontFamily);
      if (declared) {
        const family = declared.split(',')[0].replace(/[\"']/g, '').trim();
        if (supportedFontFamilies.has(family)) return family;
      }
      node = node.parentElement;
    }
    const queried = (document.queryCommandValue('fontName') || '').replace(/[\"']/g, '').trim();
    return supportedFontFamilies.has(queried) ? queried : 'REMOO Noto Sans Arabic';
  }

  function normalizeLegacyFontTags() {
    editor.querySelectorAll('font[face]').forEach((font) => {
      const family = (font.getAttribute('face') || '').replace(/[\"']/g, '').trim();
      if (!supportedFontFamilies.has(family)) return;
      font.style.fontFamily = '"' + family + '"';
      font.removeAttribute('face');
      font.removeAttribute('size');
    });
  }

  function rgbToHex(rgb) {
    if (!rgb || rgb === 'transparent' || rgb === 'rgba(0, 0, 0, 0)') return '';
    if (rgb.startsWith('#')) return rgb.toUpperCase();
    const match = rgb.match(/\d+/g);
    if (!match || match.length < 3) return '';
    return '#' + match.slice(0, 3).map(x => {
      const hex = parseInt(x, 10).toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    }).join('').toUpperCase();
  }

  function computeStats() {
    const text = (editor.innerText || '').trim();
    const words = text.length === 0 ? 0 : text.split(/\s+/).filter(Boolean).length;
    const chars = text.length;
    const paragraphs = editor.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote').length || (text.length > 0 ? 1 : 0);
    const breaks = editor.querySelectorAll('.page-break').length;
    const heightPages = Math.max(1, Math.ceil(editor.scrollHeight / 1050));
    const pageCount = Math.max(breaks + 1, heightPages);
    return { words, chars, paragraphs, pageCount };
  }

  function notifySelectionState() {
    try {
      const sel = window.getSelection();
      let anchorNode = sel && sel.rangeCount > 0 ? sel.getRangeAt(0).startContainer : null;
      const cell = getClosestTag(anchorNode, 'td') || getClosestTag(anchorNode, 'th');
      if (lastSelectedCell && lastSelectedCell !== cell) {
        lastSelectedCell.classList.remove('selected-cell');
      }
      if (cell) {
        cell.classList.add('selected-cell');
      }
      lastSelectedCell = cell;

      let alignment = 'left';
      if (document.queryCommandState('justifyCenter')) alignment = 'center';
      else if (document.queryCommandState('justifyRight')) alignment = 'right';
      else if (document.queryCommandState('justifyFull')) alignment = 'justify';

      const stats = computeStats();
      const state = {
        isBold: document.queryCommandState('bold'),
        isItalic: document.queryCommandState('italic'),
        isUnderline: document.queryCommandState('underline'),
        isStrikethrough: document.queryCommandState('strikeThrough'),
        isSuperscript: document.queryCommandState('superscript'),
        isSubscript: document.queryCommandState('subscript'),
        fontName: getSelectedFontName(sel),
        fontSize: currentFontSizePt,
        foreColor: rgbToHex(document.queryCommandValue('foreColor')) || '#1E293B',
        backColor: rgbToHex(document.queryCommandValue('backColor')) || '',
        alignment: alignment,
        lineHeight: currentLineHeight,
        isBulletList: document.queryCommandState('insertUnorderedList'),
        isNumberList: document.queryCommandState('insertOrderedList'),
        inTable: Boolean(cell),
        inImage: Boolean(lastSelectedImage),
        formatPainterActive: Boolean(copiedFormat),
        wordCount: stats.words,
        charCount: stats.chars,
        paragraphCount: stats.paragraphs,
        pageCount: stats.pageCount,
        selectedText: sel ? sel.toString().trim() : ''
      };

      if (window.AndroidBridge && window.AndroidBridge.onSelectionChanged) {
        window.AndroidBridge.onSelectionChanged(JSON.stringify(state));
      }
    } catch (e) {}
  }

  function notifyContentChanged() {
    if (suppressTracking) return;
    if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
      const payload = JSON.stringify({
        bodyHtml: editor.innerHTML,
        headerHtml: document.getElementById('pageHeader').innerHTML,
        footerHtml: document.getElementById('pageFooter').innerHTML
      });
      window.AndroidBridge.onContentChanged(payload);
    }
  }

  let miniToolbarDismissed = false;
  let cellDragStart = null;
  let cellDragPointer = null;
  let cellDragOrigin = null;
  let cellDragActive = false;
  let skipCellClick = false;

  function placeFloatingElement(element, left, top) {
    element.classList.add('visible');
    const width = element.offsetWidth || 220;
    const height = element.offsetHeight || 44;
    element.style.left = Math.max(4, Math.min(window.innerWidth - width - 4, left)) + 'px';
    element.style.top = Math.max(4, Math.min(window.innerHeight - height - 4, top)) + 'px';
  }

  function updateObjectOutline() {
    const outline = document.getElementById('objectSelectionOutline');
    const object = lastSelectedObject;
    if (!object || !editor.contains(object)) {
      outline.classList.remove('visible');
      return;
    }
    const rect = object.getBoundingClientRect();
    outline.style.left = Math.max(0, rect.left) + 'px';
    outline.style.top = Math.max(0, rect.top) + 'px';
    outline.style.width = Math.max(28, rect.width) + 'px';
    outline.style.height = Math.max(28, rect.height) + 'px';
    outline.classList.add('visible');
  }

  function updateTableChrome() {
    const chrome = document.getElementById('tableSelectionChrome');
    if (!chrome) return;
    const table = lastSelectedTable;
    if (!table || !editor.contains(table)) { chrome.classList.remove('visible'); return; }
    const editorRect = editor.getBoundingClientRect();
    const tableRect = table.getBoundingClientRect();
    chrome.style.left = (tableRect.left - editorRect.left + editor.scrollLeft) + 'px';
    chrome.style.top = (tableRect.top - editorRect.top + editor.scrollTop) + 'px';
    chrome.style.width = tableRect.width + 'px';
    chrome.style.height = tableRect.height + 'px';
    const cols = Math.max(1, table.rows[0] ? table.rows[0].cells.length : 1);
    const rows = Math.max(1, table.rows.length);
    const colBox = chrome.querySelector('.table-col-handles');
    const rowBox = chrome.querySelector('.table-row-handles');
    colBox.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    rowBox.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    colBox.innerHTML = '';
    rowBox.innerHTML = '';
    for (let c = 0; c < cols; c++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = String.fromCharCode(65 + c);
      b.dataset.tableSelectColumn = String(c);
      b.className = selectedCells.some(x => x.cellIndex === c) ? 'selected' : '';
      colBox.appendChild(b);
    }
    for (let r = 0; r < rows; r++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = String(r + 1);
      b.dataset.tableSelectRow = String(r);
      b.className = selectedCells.some(x => x.parentElement === table.rows[r]) ? 'selected' : '';
      rowBox.appendChild(b);
    }
    chrome.classList.add('visible');
  }

  function updateFloatingTools() {
    const selection = window.getSelection();
    const range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
    const mini = document.getElementById('miniFormatToolbar');
    if (range && editor.contains(range.commonAncestorContainer) && !range.collapsed && selection.toString().trim() && !miniToolbarDismissed) {
      const rect = range.getBoundingClientRect();
      placeFloatingElement(mini, (rect.left + rect.right - mini.offsetWidth) / 2, rect.top - mini.offsetHeight - 8);
    } else mini.classList.remove('visible');
    updateTableChrome();
    if (lastSelectedObject && editor.contains(lastSelectedObject)) {
      const objectTools = document.getElementById('objectQuickToolbar');
      objectTools.classList.add('visible'); objectTools.style.left = '3vw'; objectTools.style.right = '3vw'; objectTools.style.top = 'auto'; objectTools.style.bottom = '8px'; updateObjectOutline();

  function populateColorPalette(container, colors, callback) {
    if (container.dataset.ready === 'true') return;

      swatch.addEventListener('click', () => callback(color));
      container.appendChild(swatch);
    });
    container.dataset.ready = 'true';
  }

  const highlightColors = ['#FEF08A', '#BBF7D0', '#BFDBFE', '#FBCFE8', '#FFFFFF'];
  const miniForePalette = document.getElementById('miniForePalette');
  const miniBackPalette = document.getElementById('miniBackPalette');

  populateColorPalette(miniBackPalette, highlightColors, (color) => {

  function dismissMiniToolbar() {

  document.getElementById('miniFormatToolbar').addEventListener('pointerdown', (event) => event.preventDefault());
  document.getElementById('miniFormatToolbar').addEventListener('click', (event) => {

    if (action) {
      restoreEditorSelection();

      dismissMiniToolbar();

      palette.classList.toggle('visible');

  const tableChromeElement = document.getElementById('tableSelectionChrome');
  tableChromeElement.addEventListener('pointerdown', (event) => {
    const button = event.target.closest('[data-table-action="move"]');
    if (button && lastSelectedTable) {
      event.preventDefault();
      tableMoveState = { table: lastSelectedTable, x: event.clientX, y: event.clientY, pointerId: event.pointerId, moved: false };
    }
  });
  tableChromeElement.addEventListener('click', (event) => {
    const button = event.target.closest('[data-table-action]');
    if (button && button.dataset.tableAction === 'add-row') window.editorApi.addTableRow();
    else if (button && button.dataset.tableAction === 'add-col') window.editorApi.addTableCol();
    const colButton = event.target.closest('[data-table-select-column]');
    const rowButton = event.target.closest('[data-table-select-row]');
    if (colButton && lastSelectedTable) {
      const c = Number(colButton.dataset.tableSelectColumn);
      selectedCells = Array.from(lastSelectedTable.rows).map(r => r.cells[c]).filter(Boolean);
      clearCellRangeStyles(); selectedCells.forEach(cell => cell.classList.add('selected-range-cell')); lastSelectedCell = selectedCells[0] || null; updateFloatingTools(); notifySelectionState();
    } else if (rowButton && lastSelectedTable) {
      const r = Number(rowButton.dataset.tableSelectRow);
      selectedCells = Array.from(lastSelectedTable.rows[r]?.cells || []);
      clearCellRangeStyles(); selectedCells.forEach(cell => cell.classList.add('selected-range-cell')); lastSelectedCell = selectedCells[0] || null; updateFloatingTools(); notifySelectionState();
    }
  });

  function clearCellRangeStyles() {
    editor.querySelectorAll('.selected-range-cell').forEach((cell) => cell.classList.remove('selected-range-cell'));
  }

  function selectCellRectangle(startCell, endCell) {
    const table = getClosestTag(startCell, 'table');
    if (!table || getClosestTag(endCell, 'table') !== table) return;
    const rows = Array.from(table.rows);
    const startRow = rows.indexOf(startCell.parentElement);
    const endRow = rows.indexOf(endCell.parentElement);
    if (startRow < 0 || endRow < 0) return;
    const top = Math.min(startRow, endRow), bottom = Math.max(startRow, endRow);
    const left = Math.min(startCell.cellIndex, endCell.cellIndex);
    const right = Math.max(startCell.cellIndex, endCell.cellIndex);
    clearCellRangeStyles();
    selectedCells = [];
    for (let rowIndex = top; rowIndex <= bottom; rowIndex++) {
      for (let columnIndex = left; columnIndex <= right; columnIndex++) {
        const cell = rows[rowIndex].cells[columnIndex];
        if (cell) {
          selectedCells.push(cell);
          cell.classList.add('selected-range-cell');
        }
      }
    }
    lastSelectedCell = endCell;
    lastSelectedTable = table;
    updateFloatingTools();
    notifySelectionState();
  }

  function getEditorBlockAtPoint(x, y) {
    const hit = document.elementsFromPoint(x, y).find((element) => editor.contains(element));
    if (!hit) return null;
    let block = hit;
    while (block && block.parentElement !== editor) block = block.parentElement;
    return block && block.parentElement === editor ? block : null;
  }

  editor.addEventListener('pointerdown', (event) => {
    const cell = event.target.closest && event.target.closest('td, th');
    if (!cell) return;
    lastSelectedCell = cell;
    lastSelectedTable = getClosestTag(cell, 'table');
    if (!cellDragActive) {
      clearCellRangeStyles();
      selectedCells = [cell];
    }
    cellDragStart = cell;
    cellDragPointer = event.pointerId;
    cellDragOrigin = { x: event.clientX, y: event.clientY };
    cellDragActive = false;
  });


  document.addEventListener('pointermove', (event) => {
    if (cellDragStart && event.pointerId === cellDragPointer && cellDragOrigin) {
      const distance = Math.hypot(event.clientX - cellDragOrigin.x, event.clientY - cellDragOrigin.y);
      if (distance > 7) {
        cellDragActive = true;
        editor.classList.add('cell-selecting');
        event.preventDefault();
        const underPointer = document.elementFromPoint(event.clientX, event.clientY);
        const endCell = underPointer && underPointer.closest ? underPointer.closest('td, th') : null;
        if (endCell && getClosestTag(endCell, 'table') === getClosestTag(cellDragStart, 'table')) {
          selectCellRectangle(cellDragStart, endCell);
        }
      }
    }

    if (tableMoveState && event.pointerId === tableMoveState.pointerId) {
      if (!tableMoveState.moved && Math.hypot(event.clientX - tableMoveState.x, event.clientY - tableMoveState.y) < 7) return;
      tableMoveState.moved = true;
      event.preventDefault();
      tableMoveState.table.style.opacity = '0.45';
      const target = getEditorBlockAtPoint(event.clientX, event.clientY);
      if (target && target !== tableMoveState.table) {
        const rect = target.getBoundingClientRect();
        editor.insertBefore(tableMoveState.table, event.clientY < rect.top + rect.height / 2 ? target : target.nextSibling);
      }
    }
  }, { passive: false });

  document.addEventListener('pointerup', (event) => {
    if (cellDragStart && event.pointerId === cellDragPointer) {
      editor.classList.remove('cell-selecting');
      if (!cellDragActive) selectedCells = [cellDragStart];
      else skipCellClick = true;
      if (!cellDragActive) lastSelectedCell = cellDragStart;
      else if (selectedCells.length) lastSelectedCell = selectedCells[selectedCells.length - 1];
      cellDragStart = null;
      cellDragPointer = null;
      cellDragOrigin = null;
      cellDragActive = false;
      updateFloatingTools();
    }
    if (tableMoveState && event.pointerId === tableMoveState.pointerId) {
      tableMoveState.table.style.opacity = '';
      if (tableMoveState.moved) notifyContentChanged();
      tableMoveState = null;
      updateTableChrome();
    }
  });

  document.querySelectorAll('#objectQuickToolbar button, #objectSelectionOutline button').forEach((button) => {
    button.addEventListener('pointerdown', (event) => event.preventDefault());
  });

  let objectGesture = null;
  let selectedObjectBorderColor = '#60646B';
  let selectedObjectBorderStyle = 'solid';

  function beginObjectGesture(event, kind, handle) {
    if (!lastSelectedObject || !editor.contains(lastSelectedObject)) return;
    event.preventDefault();
    const rect = lastSelectedObject.getBoundingClientRect();
    const computedRotate = parseFloat(getComputedStyle(lastSelectedObject).rotate) || 0;
    objectGesture = {
      object: lastSelectedObject, kind, handle,
      pointerId: event.pointerId, startX: event.clientX, startY: event.clientY,
      width: rect.width, height: rect.height,
      left: parseFloat(lastSelectedObject.style.left) || 0,
      top: parseFloat(lastSelectedObject.style.top) || 0,
      rotation: computedRotate,
      centerX: rect.left + rect.width / 2,
      centerY: rect.top + rect.height / 2,
      startAngle: Math.atan2(event.clientY - (rect.top + rect.height / 2), event.clientX - (rect.left + rect.width / 2)) * 180 / Math.PI
    };
  }

  document.getElementById('objectDragButton').addEventListener('pointerdown', (event) => beginObjectGesture(event, 'move', 'move'));
  document.getElementById('objectSelectionOutline').addEventListener('pointerdown', (event) => {
    const handle = event.target.closest && event.target.closest('[data-handle]');
    if (handle) beginObjectGesture(event, handle.dataset.handle === 'rotate' ? 'rotate' : 'resize', handle.dataset.handle);
  });

  document.addEventListener('pointermove', (event) => {
    if (!objectGesture || event.pointerId !== objectGesture.pointerId) return;
    event.preventDefault();
    const dx = event.clientX - objectGesture.startX;
    const dy = event.clientY - objectGesture.startY;
    const object = objectGesture.object;
    if (objectGesture.kind === 'move') {
      object.style.position = 'relative';
      object.style.left = (objectGesture.left + dx) + 'px';
      object.style.top = (objectGesture.top + dy) + 'px';
    } else if (objectGesture.kind === 'rotate') {
      const angle = Math.atan2(event.clientY - objectGesture.centerY, event.clientX - objectGesture.centerX) * 180 / Math.PI;
      object.style.rotate = (objectGesture.rotation + angle - objectGesture.startAngle) + 'deg';
    } else {
      const handle = objectGesture.handle;
      let width = objectGesture.width;
      let height = objectGesture.height;
      if (handle.includes('e')) width += dx;
      if (handle.includes('w')) width -= dx;
      if (handle.includes('s')) height += dy;
      if (handle.includes('n')) height -= dy;
      width = Math.max(36, Math.min(editor.clientWidth, width));
      height = Math.max(28, Math.min(1200, height));
      object.style.width = width + 'px';
      if (object.tagName.toLowerCase() === 'img') {
        object.style.height = 'auto';
      } else {
        object.style.height = height + 'px';
        const svg = object.querySelector('svg');
        if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; }
      }
    }
    updateObjectOutline();
  }, { passive: false });

  document.addEventListener('pointerup', (event) => {
    if (!objectGesture || event.pointerId !== objectGesture.pointerId) return;
    objectGesture = null;
    updateFloatingTools();
    notifyContentChanged();
  });

  document.getElementById('objectQuickToolbar').addEventListener('click', (event) => {
    const wrapButton = event.target.closest('[data-wrap]');
    const borderButton = event.target.closest('[data-border]');
    const colorButton = event.target.closest('[data-object-color]');
    if (!lastSelectedObject) return;
    if (wrapButton) {
      const object = lastSelectedObject;
      object.style.float = '';
      object.style.clear = '';
      object.style.zIndex = '';
      if (wrapButton.dataset.wrap === 'inline') {
        object.style.display = 'inline-block';
        object.style.position = 'relative';
      } else if (wrapButton.dataset.wrap === 'top-bottom') {
        object.style.display = 'table';

      } else if (wrapButton.dataset.wrap === 'square') {
        object.style.display = 'inline-block';

        object.style.margin = '6px 0 6px 12px';
      } else if (wrapButton.dataset.wrap === 'front') {
        object.style.position = 'relative';

      }
    }
    if (wrapButton || borderButton || colorButton) notifyContentChanged();
  });

  let activeDrawingPath = null;

  function ensureDrawingLayer() {
    if (drawingLayer && editor.contains(drawingLayer)) return drawingLayer;
    drawingLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    drawingLayer.setAttribute('id', 'remofficeDrawingLayer');
    drawingLayer.setAttribute('contenteditable', 'false');
    drawingLayer.classList.add('draw-layer');
    editor.appendChild(drawingLayer);
    resizeDrawingLayer();
    drawingLayer.addEventListener('pointerdown', (event) => {
      if (!drawingMode) return;
      event.preventDefault();
      const rect = editor.getBoundingClientRect();
      const x = event.clientX - rect.left + editor.scrollLeft;
      const y = event.clientY - rect.top + editor.scrollTop;
      activeDrawingPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      activeDrawingPath.setAttribute('d', `M ${x} ${y}`);
      activeDrawingPath.setAttribute('fill', 'none');
      activeDrawingPath.setAttribute('stroke', '#1A56DB');
      activeDrawingPath.setAttribute('stroke-width', '3');
      activeDrawingPath.setAttribute('stroke-linecap', 'round');
      activeDrawingPath.setAttribute('stroke-linejoin', 'round');
      drawingLayer.appendChild(activeDrawingPath);
      try { drawingLayer.setPointerCapture(event.pointerId); } catch (_) {}
    });
    drawingLayer.addEventListener('pointermove', (event) => {
      if (!drawingMode || !activeDrawingPath) return;
      const rect = editor.getBoundingClientRect();
      const x = event.clientX - rect.left + editor.scrollLeft;
      const y = event.clientY - rect.top + editor.scrollTop;
      activeDrawingPath.setAttribute('d', activeDrawingPath.getAttribute('d') + ` L ${x} ${y}`);
    });
    const finishStroke = () => {
      if (!activeDrawingPath) return;
      activeDrawingPath = null;
      notifyContentChanged();
    };
    drawingLayer.addEventListener('pointerup', finishStroke);
    drawingLayer.addEventListener('pointercancel', finishStroke);
    return drawingLayer;
  }

  function resizeDrawingLayer() {
    if (!drawingLayer) return;
    const width = Math.max(1, editor.clientWidth);
    const height = Math.max(editor.clientHeight, editor.scrollHeight, 1);
    drawingLayer.setAttribute('width', width);
    drawingLayer.setAttribute('height', height);
    drawingLayer.setAttribute('viewBox', `0 0 ${width} ${height}`);
    drawingLayer.style.width = width + 'px';
    drawingLayer.style.height = height + 'px';
  }

  function setDrawingMode(enabled) {
    drawingMode = Boolean(enabled);

  document.getElementById('stopDrawingButton').addEventListener('click', () => setDrawingMode(false));

  document.addEventListener('selectionchange', function() {

  editor.addEventListener('click', function(e) {
    const image = e.target.closest && e.target.closest('img');
    const movable = e.target.closest && e.target.closest('img, .text-box, .shape-block');
    if (lastSelectedImage && lastSelectedImage !== image) {
      lastSelectedImage.classList.remove('selected-img');

  function insertAutomaticPageBreaks() {
    editor.querySelectorAll('.auto-page-break').forEach((breakElement) => breakElement.remove());
    const pageStyle = getComputedStyle(pageContainer);
    const pageHeight = parseFloat(pageStyle.minHeight) || 1122;
    const topPadding = parseFloat(pageStyle.paddingTop) || 0;
    const bottomPadding = parseFloat(pageStyle.paddingBottom) || 0;
    const headerHeight = document.getElementById('pageHeader').offsetHeight;
    const footerHeight = document.getElementById('pageFooter').offsetHeight;
    const contentCapacity = Math.max(300, pageHeight - topPadding - bottomPadding - headerHeight - footerHeight);
    let usedHeight = 0;
    const blocks = Array.from(editor.children);

    for (const block of blocks) {
      if (block.classList.contains('draw-layer')) continue;
      if (block.classList.contains('page-break')) {
        usedHeight = 0;
        continue;
      }

      const style = getComputedStyle(block);
      const outerHeight = block.offsetHeight + (parseFloat(style.marginTop) || 0) + (parseFloat(style.marginBottom) || 0);
      if (usedHeight > 0 && usedHeight + outerHeight > contentCapacity) {
        const pageBreak = document.createElement('div');
        pageBreak.className = 'page-break auto-page-break';
        pageBreak.setAttribute('contenteditable', 'false');
        pageBreak.setAttribute('aria-label', 'صفحة جديدة');
        editor.insertBefore(pageBreak, block);
        usedHeight = 0;
      }
      usedHeight += outerHeight;
    }
  }

  editor.addEventListener('beforeinput', function(e) {
    if (!trackChangesEnabled || suppressTracking) return;

    const inputType = e.inputType;
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);

    if (inputType === 'insertText' || inputType === 'insertCompositionText' || inputType === 'insertFromPaste') {
      const textToInsert = e.data || (e.clipboardData ? e.clipboardData.getData('text/plain') : '');
      if (!textToInsert) return;

      e.preventDefault();
      const changeId = 'tc_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const anchor = getCurrentSelectionAnchor();

      suppressTracking = true;
      range.deleteContents();

      const ins = document.createElement('ins');
      ins.setAttribute('data-remoffice-change-id', changeId);
      ins.className = 'remoffice-insert';
      ins.textContent = textToInsert;

      range.insertNode(ins);

      const newRange = document.createRange();
      newRange.setStartAfter(ins);
      newRange.setEndAfter(ins);
      sel.removeAllRanges();
      sel.addRange(newRange);

      suppressTracking = false;

      const changeObj = {
        id: changeId,
        type: 'INSERT',
        elementId: anchor ? anchor.elementId : '',
        anchor: anchor,
        oldText: '',
        newText: textToInsert,
        oldHtml: '',
        newHtml: ins.outerHTML,
        author: 'المستخدم',
        timestamp: Date.now(),
        status: 'PENDING',
        createdByUser: true
      };
      if (window.AndroidBridge && window.AndroidBridge.onTrackedChange) {
        window.AndroidBridge.onTrackedChange(JSON.stringify(changeObj));
      }
      notifyContentChanged();
    } else if (inputType === 'deleteContentBackward' || inputType === 'deleteContentForward' || inputType === 'deleteByCut') {
      let deletedText = sel.toString();
      if (!deletedText && inputType === 'deleteContentBackward') {
        const cloneRange = range.cloneRange();
        if (cloneRange.startOffset > 0) {
          cloneRange.setStart(cloneRange.startContainer, cloneRange.startOffset - 1);
          deletedText = cloneRange.toString();
        }
      }
      if (!deletedText) return;

      e.preventDefault();
      const changeId = 'tc_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const anchor = getCurrentSelectionAnchor();

      suppressTracking = true;
      if (sel.isCollapsed && inputType === 'deleteContentBackward') {
        const cloneRange = range.cloneRange();
        if (cloneRange.startOffset > 0) {
          cloneRange.setStart(cloneRange.startContainer, cloneRange.startOffset - 1);
          cloneRange.deleteContents();
        }
      } else {
        range.deleteContents();
      }

      const del = document.createElement('del');
      del.setAttribute('data-remoffice-change-id', changeId);
      del.className = 'remoffice-delete';
      del.textContent = deletedText;

      range.insertNode(del);

      const newRange = document.createRange();
      newRange.setStartAfter(del);
      newRange.setEndAfter(del);
      sel.removeAllRanges();
      sel.addRange(newRange);

      suppressTracking = false;

      const changeObj = {
        id: changeId,
        type: 'DELETE',
        elementId: anchor ? anchor.elementId : '',
        anchor: anchor,
        oldText: deletedText,
        newText: '',
        oldHtml: '',
        newHtml: del.outerHTML,
        author: 'المستخدم',
        timestamp: Date.now(),
        status: 'PENDING',
        createdByUser: true
      };
      if (window.AndroidBridge && window.AndroidBridge.onTrackedChange) {
        window.AndroidBridge.onTrackedChange(JSON.stringify(changeObj));
      }
      notifyContentChanged();
    }
  });

  // --- Implementations ---
  let elementIdCounter = 1;
  function ensureElementIds() {
    const blocks = editor.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, td, th, div.text-box');
    blocks.forEach(el => {
      if (!el.getAttribute('data-remoffice-id')) {
        el.setAttribute('data-remoffice-id', 'remo_' + elementIdCounter++);
      }
    });
  }

  function getCurrentSelectionAnchor() {
    ensureElementIds();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let el = node.nodeType === 1 ? node : node.parentElement;
    while (el && el !== editor && !el.getAttribute('data-remoffice-id')) {
      el = el.parentElement;
    }
    if (!el || el === editor) {
      el = range.startContainer.parentElement;
    }
    const elementId = el ? (el.getAttribute('data-remoffice-id') || '') : '';
    return {
      elementId: elementId,
      startOffset: range.startOffset,
      endOffset: range.endOffset,
      quotedText: sel.toString().trim()
    };
  }

  function findElementByRemofficeId(id) {
    if (!id) return null;
    return editor.querySelector(`[data-remoffice-id="${id}"]`);
  }

  function highlightElementTemporarily(el) {
    if (!el) return;
    const origBg = el.style.backgroundColor;
    el.style.transition = 'background-color 0.5s';
    el.style.backgroundColor = '#FEF08A';
    setTimeout(() => { el.style.backgroundColor = origBg; }, 1500);
  }

  function scrollToAnchor(anchorJson) {
    let anchor = typeof anchorJson === 'string' ? JSON.parse(anchorJson) : anchorJson;
    if (!anchor || !anchor.elementId) return;
    const el = findElementByRemofficeId(anchor.elementId);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      highlightElementTemporarily(el);
    }
  }

  function selectAnchor(anchorJson) {
    let anchor = typeof anchorJson === 'string' ? JSON.parse(anchorJson) : anchorJson;
    if (!anchor || !anchor.elementId) return;
    const el = findElementByRemofficeId(anchor.elementId);
    if (el) {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  // --- Track Changes Implementation ---
  function setTrackChangesEnabled(enabled) {
    trackChangesEnabled = Boolean(enabled);
    ensureElementIds();
  }

  function acceptTrackedChange(id) {
    suppressTracking = true;
    const ins = editor.querySelector(`ins[data-remoffice-change-id="${id}"]`);
    if (ins) {
      const parent = ins.parentNode;
      while (ins.firstChild) parent.insertBefore(ins.firstChild, ins);
      parent.removeChild(ins);
    }
    const del = editor.querySelector(`del[data-remoffice-change-id="${id}"]`);
    if (del) {
      del.parentNode.removeChild(del);
    }
    suppressTracking = false;
    notifyContentChanged();
  }

  function rejectTrackedChange(id) {
    suppressTracking = true;
    const ins = editor.querySelector(`ins[data-remoffice-change-id="${id}"]`);
    if (ins) {
      ins.parentNode.removeChild(ins);
    }
    const del = editor.querySelector(`del[data-remoffice-change-id="${id}"]`);
    if (del) {
      const parent = del.parentNode;
      while (del.firstChild) parent.insertBefore(del.firstChild, del);
      parent.removeChild(del);
    }
    suppressTracking = false;
    notifyContentChanged();
  }

  function acceptAllTrackedChanges() {
    suppressTracking = true;
    const insList = editor.querySelectorAll('ins[data-remoffice-change-id]');
    insList.forEach(ins => {
      const parent = ins.parentNode;
      while (ins.firstChild) parent.insertBefore(ins.firstChild, ins);
      parent.removeChild(ins);
    });
    const delList = editor.querySelectorAll('del[data-remoffice-change-id]');
    delList.forEach(del => del.parentNode.removeChild(del));
    suppressTracking = false;
    notifyContentChanged();
  }

  function rejectAllTrackedChanges() {
    suppressTracking = true;
    const insList = editor.querySelectorAll('ins[data-remoffice-change-id]');
    insList.forEach(ins => ins.parentNode.removeChild(ins));
    const delList = editor.querySelectorAll('del[data-remoffice-change-id]');
    delList.forEach(del => {
      const parent = del.parentNode;
      while (del.firstChild) parent.insertBefore(del.firstChild, del);
      parent.removeChild(del);
    });
    suppressTracking = false;
    notifyContentChanged();
  }

  function goToNextTrackedChange() {
    const list = editor.querySelectorAll('ins[data-remoffice-change-id], del[data-remoffice-change-id]');
    if (list.length === 0) return;
    trackedChangeIndex = (trackedChangeIndex + 1) % list.length;
    const el = list[trackedChangeIndex];
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightElementTemporarily(el);
  }

  function goToPreviousTrackedChange() {
    const list = editor.querySelectorAll('ins[data-remoffice-change-id], del[data-remoffice-change-id]');
    if (list.length === 0) return;
    trackedChangeIndex = (trackedChangeIndex - 1 + list.length) % list.length;
    const el = list[trackedChangeIndex];
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightElementTemporarily(el);
  }

  // --- Comments Implementation ---
  function createCommentAnchor(commentId) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    const text = sel.toString().trim();
    if (!text) return null;

    const anchor = getCurrentSelectionAnchor();
    const mark = document.createElement('mark');
    mark.setAttribute('data-remoffice-comment-id', commentId);
    mark.className = 'remoffice-comment-anchor';
    try {
      range.surroundContents(mark);
    } catch (e) {
      const frag = range.extractContents();
      mark.appendChild(frag);
      range.insertNode(mark);
    }
    notifyContentChanged();
    const resultObj = {
      commentId: commentId,
      quote: text,
      anchor: anchor
    };
    if (window.AndroidBridge && window.AndroidBridge.onCommentAnchorCreated) {
      window.AndroidBridge.onCommentAnchorCreated(JSON.stringify(resultObj));
    }
    return resultObj;
  }

  function selectCommentAnchor(commentId) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(mark);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function removeCommentAnchor(commentId) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      const parent = mark.parentNode;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      notifyContentChanged();
    }
  }

  function setCommentResolved(commentId, resolved) {
    const mark = editor.querySelector(`mark[data-remoffice-comment-id="${commentId}"]`);
    if (mark) {
      if (resolved) {
        mark.classList.add('resolved');
      } else {
        mark.classList.remove('resolved');
      }
      notifyContentChanged();
    }
  }

  // --- Styles Implementation ---
  function applyStyle(styleJson) {
    focusEditor();
    let style = typeof styleJson === 'string' ? JSON.parse(styleJson) : styleJson;
    if (!style || !style.name) return;
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    let node = sel.getRangeAt(0).startContainer;
    let block = node.nodeType === 1 ? node : node.parentElement;
    while (block && block !== editor && !['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'BLOCKQUOTE'].includes(block.tagName)) {
      block = block.parentElement;
    }
    if (!block || block === editor) {
      block = document.createElement(style.htmlTag || 'p');
      block.innerHTML = sel.toString() || '<br>';
      editor.appendChild(block);
    } else if (style.htmlTag && block.tagName.toLowerCase() !== style.htmlTag.toLowerCase()) {
      const newBlock = document.createElement(style.htmlTag);
      newBlock.innerHTML = block.innerHTML;
      block.parentNode.replaceChild(newBlock, block);
      block = newBlock;
    }

    applyStyleToElement(block, style);
    notifyContentChanged();
  }

  function updateStyle(styleJson) {
    let style = typeof styleJson === 'string' ? JSON.parse(styleJson) : styleJson;
    if (!style || !style.name) return;
    const elements = editor.querySelectorAll(`[data-remoffice-style="${style.name}"]`);
    elements.forEach(el => applyStyleToElement(el, style));
    notifyContentChanged();
  }

  function applyStyleToElement(block, style) {
    block.setAttribute('data-remoffice-style', style.name);
    if (style.fontFamily) block.style.fontFamily = style.fontFamily;
    if (style.fontSizePt) block.style.fontSize = style.fontSizePt + 'pt';
    if (style.colorHex) block.style.color = style.colorHex;
    block.style.fontWeight = style.isBold ? 'bold' : 'normal';
    block.style.fontStyle = style.isItalic ? 'italic' : 'normal';
    block.style.textDecoration = style.isUnderline ? 'underline' : 'none';
    if (style.alignment) block.style.textAlign = style.alignment;
    if (style.dir) block.style.direction = style.dir;
    if (style.lineHeight) block.style.lineHeight = style.lineHeight;
    if (style.spaceBeforePt !== undefined && style.spaceBeforePt !== null) block.style.marginTop = style.spaceBeforePt + 'pt';
    if (style.spaceAfterPt !== undefined && style.spaceAfterPt !== null) block.style.marginBottom = style.spaceAfterPt + 'pt';
    if (style.indentMm !== undefined && style.indentMm !== null) block.style.marginInlineStart = style.indentMm + 'mm';
  }

  // --- Notes (Footnotes & Endnotes) Implementation ---
  function insertFootnote(noteJson) {
    focusEditor();
    let note = typeof noteJson === 'string' ? JSON.parse(noteJson) : noteJson;
    if (!note || !note.id) return;

    const fnSection = document.getElementById('remofficeFootnotes');
    if (fnSection) fnSection.style.display = 'block';

    const refId = 'fnref_' + note.id;
    const itemId = 'fn_' + note.id;

    const sup = document.createElement('sup');
    sup.id = refId;
    sup.setAttribute('data-remoffice-note-id', note.id);
    sup.setAttribute('data-remoffice-note-type', 'FOOTNOTE');
    sup.className = 'remoffice-note-reference';
    sup.innerHTML = `<a href="#${itemId}" onclick="window.editorApi.scrollToNote('${note.id}');return false;">${note.number || 1}</a>`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(sup);
    } else {
      editor.appendChild(sup);
    }

    if (fnSection) {
      const item = document.createElement('div');
      item.id = itemId;
      item.setAttribute('data-remoffice-note-item-id', note.id);
      item.className = 'remoffice-note-item';
      item.innerHTML = `<sup>${note.number || 1}</sup> ${note.text} <a href="#${refId}" onclick="window.editorApi.scrollToNoteReference('${note.id}');return false;">[↩]</a>`;
      fnSection.appendChild(item);
    }

    renumberNotes();
    notifyContentChanged();
  }

  function insertEndnote(noteJson) {
    focusEditor();
    let note = typeof noteJson === 'string' ? JSON.parse(noteJson) : noteJson;
    if (!note || !note.id) return;

    const enSection = document.getElementById('remofficeEndnotes');
    if (enSection) enSection.style.display = 'block';

    const refId = 'enref_' + note.id;
    const itemId = 'en_' + note.id;

    const sup = document.createElement('sup');
    sup.id = refId;
    sup.setAttribute('data-remoffice-note-id', note.id);
    sup.setAttribute('data-remoffice-note-type', 'ENDNOTE');
    sup.className = 'remoffice-note-reference';
    sup.innerHTML = `<a href="#${itemId}" onclick="window.editorApi.scrollToNote('${note.id}');return false;">${note.number || 1}</a>`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(sup);
    } else {
      editor.appendChild(sup);
    }

    if (enSection) {
      const item = document.createElement('div');
      item.id = itemId;
      item.setAttribute('data-remoffice-note-item-id', note.id);
      item.className = 'remoffice-note-item';
      item.innerHTML = `<sup>${note.number || 1}</sup> ${note.text} <a href="#${refId}" onclick="window.editorApi.scrollToNoteReference('${note.id}');return false;">[↩]</a>`;
      enSection.appendChild(item);
    }

    renumberNotes();
    notifyContentChanged();
  }

  function scrollToNote(noteId) {
    const item = document.querySelector(`[data-remoffice-note-item-id="${noteId}"]`);
    if (item) item.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function scrollToNoteReference(noteId) {
    const ref = editor.querySelector(`sup[data-remoffice-note-id="${noteId}"]`);
    if (ref) ref.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function deleteNote(noteId) {
    const ref = editor.querySelector(`sup[data-remoffice-note-id="${noteId}"]`);
    if (ref) ref.parentNode.removeChild(ref);
    const item = document.querySelector(`[data-remoffice-note-item-id="${noteId}"]`);
    if (item) item.parentNode.removeChild(item);
    renumberNotes();
    notifyContentChanged();
  }

  function renumberNotes() {
    const fnRefs = editor.querySelectorAll('sup[data-remoffice-note-type="FOOTNOTE"]');
    fnRefs.forEach((ref, idx) => {
      const num = idx + 1;
      const a = ref.querySelector('a');
      if (a) a.textContent = String(num);
      const noteId = ref.getAttribute('data-remoffice-note-id');
      const item = document.querySelector(`div[data-remoffice-note-item-id="${noteId}"]`);
      if (item && item.querySelector('sup')) {
        item.querySelector('sup').textContent = String(num);
      }
    });

    const enRefs = editor.querySelectorAll('sup[data-remoffice-note-type="ENDNOTE"]');
    enRefs.forEach((ref, idx) => {
      const num = idx + 1;
      const a = ref.querySelector('a');
      if (a) a.textContent = String(num);
      const noteId = ref.getAttribute('data-remoffice-note-id');
      const item = document.querySelector(`div[data-remoffice-note-item-id="${noteId}"]`);
      if (item && item.querySelector('sup')) {
        item.querySelector('sup').textContent = String(num);
      }
    });
  }

  // --- Bookmarks & Internal Links Implementation ---
  function addBookmark(bookmarkJson) {
    focusEditor();
    let bm = typeof bookmarkJson === 'string' ? JSON.parse(bookmarkJson) : bookmarkJson;
    if (!bm || !bm.id || !bm.name) return;

    const span = document.createElement('span');
    span.id = 'bm_' + bm.id;
    span.setAttribute('data-remoffice-bookmark-id', bm.id);
    span.setAttribute('data-remoffice-bookmark-name', bm.name);
    span.className = 'remoffice-bookmark';
    span.title = `Bookmark: ${bm.name}`;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(span);
    } else {
      editor.appendChild(span);
    }
    notifyContentChanged();
  }

  function renameBookmark(id, newName) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"]`);
    if (bm) {
      bm.setAttribute('data-remoffice-bookmark-name', newName);
      bm.title = `Bookmark: ${newName}`;
      notifyContentChanged();
    }
  }

  function deleteBookmark(id) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"]`);
    if (bm) {
      bm.parentNode.removeChild(bm);
      notifyContentChanged();
    }
  }

  function goToBookmark(id) {
    const bm = editor.querySelector(`span[data-remoffice-bookmark-id="${id}"], #bm_${id}`);
    if (bm) {
      bm.scrollIntoView({ behavior: 'smooth', block: 'center' });
      bm.style.borderInlineStartWidth = '6px';
      setTimeout(() => { bm.style.borderInlineStartWidth = '3px'; }, 1500);
    }
  }

  function insertInternalLink(bookmarkId, text) {
    focusEditor();
    const link = document.createElement('a');
    link.href = `#bm_${bookmarkId}`;
    link.textContent = text || 'رابط العلامة المرجعية';
    link.onclick = function(e) {
      e.preventDefault();
      goToBookmark(bookmarkId);
      return false;
    };
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.insertNode(link);
    } else {
      editor.appendChild(link);
    }
    notifyContentChanged();
  }

  // --- Table of Contents Implementation ---
  function insertTableOfContents() {
    removeTableOfContents();
    const headings = editor.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length === 0) return false;

    const tocBox = document.createElement('div');
    tocBox.id = 'remofficeTocBox';
    tocBox.className = 'remoffice-toc-box';
    tocBox.setAttribute('contenteditable', 'false');

    let html = '<h3 style="margin-top:0;color:#0F172A;">جدول المحتويات / Table of Contents</h3><ul style="list-style:none;padding-inline-start:0;margin:0;">';
    headings.forEach((h, idx) => {
      const hId = h.id || `heading_toc_${idx}`;
      h.id = hId;
      const level = parseInt(h.tagName.substring(1), 10);
      const indent = (level - 1) * 16;
      html += `<li style="margin-inline-start:${indent}px;margin-bottom:4px;"><a href="#${hId}" onclick="window.editorApi.goToHeading('${hId}');return false;" style="color:#1A56DB;text-decoration:none;">• ${h.textContent}</a></li>`;
    });
    html += '</ul>';
    tocBox.innerHTML = html;

    editor.insertBefore(tocBox, editor.firstChild);
    notifyContentChanged();
    return true;
  }

  function updateTableOfContents() {
    return insertTableOfContents();
  }

  function removeTableOfContents() {
    const box = editor.querySelector('#remofficeTocBox');
    if (box) box.parentNode.removeChild(box);
    notifyContentChanged();
  }

  function goToHeading(id) {
    const h = editor.querySelector(`#${id}`);
    if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  setTimeout(notifySelectionState, 200);
})();
</script>
</body>
</html>
